name: release

# Tagging is the release. Nothing here runs on main, so an ordinary push can
# never publish anything.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # "Install is one binary" is a promise about the product, so the release
      # is where it gets kept: no interpreter, no CGO, no shared libraries.
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          out="dist/bothy-${GOOS}-${GOARCH}"
          if [ "$GOOS" = windows ]; then out="${out}.exe"; fi
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" \
            -o "$out" ./cmd/bothy
          # Only the host platform's binary can actually be executed here, and
          # it is worth proving the stamped version made it in.
          if [ "$GOOS/$GOARCH" = linux/amd64 ]; then "$out" version; fi

      - uses: actions/upload-artifact@v4
        with:
          name: bothy-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish the release
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum bothy-* > SHA256SUMS
          cat SHA256SUMS

      # `gh` is preinstalled on the runner, so a third-party release action would
      # be a dependency for no reason. This project has none.
      - name: create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

  image:
    name: image to ghcr.io
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: log in to ghcr.io
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # arm64 as well, because the machines people want to donate are as often
      # Apple silicon as they are a desktop with a discrete card.
      - name: build and push
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$version" \
            --tag "ghcr.io/${{ github.repository }}:$version" \
            --tag "ghcr.io/${{ github.repository }}:latest" \
            --push .
